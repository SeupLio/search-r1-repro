# =============================================================================
# Search-R1 / GRPO / Qwen2.5-7B-Base —— 对齐论文 Appendix B.2 的 GRPO 段 + Table 8
# =============================================================================
data:
  train_files: data/nq_hotpotqa_train.parquet
  val_files: data/nq_test.parquet
  train_batch_size: 512
  max_prompt_length: 4096
  max_response_length: 500
  return_raw_chat: True
  shuffle: True
  filter_overlong_prompts: True

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-7B
    enable_gradient_checkpointing: True

  actor:
    optim:
      lr: 1.0e-6
      lr_warmup_steps_ratio: 0.285
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 64
    use_kl_loss: True
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    clip_ratio: 0.2
    fsdp_config:
      param_offload: True
      optimizer_offload: True

  rollout:
    name: sglang                                     # [DEVIATION] 论文用 vLLM
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    temperature: 1.0
    top_p: 1.0
    n: 5                                             # 论文 GRPO 每 prompt 采样 5 条 (group size = 5)
    log_prob_micro_batch_size_per_gpu: 8
    free_cache_engine: True
    multi_turn:
      enable: True
      max_turns: 4
      format: search_r1
      tool_config_path: configs/search_tool_config.yaml

  ref:
    fsdp_config:
      param_offload: True
    log_prob_micro_batch_size_per_gpu: 8

algorithm:
  adv_estimator: grpo                                # 论文 Section 5.1 对比的 GRPO
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: True
  use_kl_in_reward: False

trainer:
  n_gpus_per_node: 8
  nnodes: 1
  total_epochs: 1
  total_training_steps: 500
  save_freq: 100
  test_freq: 100
  val_before_train: False
  project_name: search_r1_repro
  experiment_name: grpo_qwen2.5-7b-base
  logger: ["console", "wandb"]
  default_local_dir: checkpoints/search_r1_grpo_7b
